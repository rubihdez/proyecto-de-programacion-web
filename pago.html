<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago | La Gordiflona</title>
    <link rel="stylesheet" href="normalice.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Truculenta:opsz,wght@12..72,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <style>
        body { background-color: #FFFDF7; font-family: "Truculenta", sans-serif; color: #333333; }
        .pago-pagina { max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
        .pago-tarjeta { background: #FFFFFF; border: 1px solid #0C5335; border-radius: 12px; padding: 1.4rem; margin-bottom: 1.5rem; }
        .pago-tarjeta h1, .pago-tarjeta h2 { font-family: "Cinzel", serif; color: #0C5335; margin-top: 0; }
        .pago-tarjeta h1 { font-size: 1.5rem; }
        .pago-tarjeta h2 { font-size: 1.15rem; }
        .resumen-lista { list-style: none; margin: 0; padding: 0; }
        .resumen-lista li { padding: 8px 0; border-bottom: 1px dashed #e2d3b2; }
        .resumen-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 2px solid #0C5335; font-family: "Cinzel", serif; color: #0C5335; }
        .pago-tarjeta label { display: block; margin-top: 0.9rem; font-weight: 700; }
        .pago-tarjeta input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 4px; border: 1px solid #0C5335; border-radius: 6px; background: #FFFDF7; }
        .fila-doble { display: flex; gap: 1rem; }
        .fila-doble > div { flex: 1; }
        .btn-pagar { width: 100%; margin-top: 1.4rem; padding: 12px; background: #0C5335; color: #FFFFFF; border: none; border-radius: 8px; font-family: "Cinzel", serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color .3s ease; }
        .btn-pagar:hover { background: #8C2D19; }
        .aviso-simulado { font-size: 0.9rem; font-style: italic; color: #555555; margin-top: 0.8rem; }
        .exito { display: none; text-align: center; }
        .exito h2 { color: #0C5335; }
        .exito .folio { font-family: "Cinzel", serif; font-size: 1.3rem; color: #8C2D19; }
        .btn-volver { display: inline-block; margin-top: 1rem; padding: 10px 20px; background: #0C5335; color: #F4D068; border-radius: 8px; text-decoration: none; font-family: "Cinzel", serif; }
        .btn-volver:hover { background: #8C2D19; }
    </style>
</head>
<body>
<main class="pago-pagina">

    <!-- Resumen del pedido -->
    <section class="pago-tarjeta" id="resumen">
        <h1>Resumen de tu pedido</h1>
        <p>Folio: <strong id="r-folio">—</strong></p>
        <p>Cliente: <strong id="r-nombre">—</strong> · <span id="r-tipo"></span></p>
        <ul class="resumen-lista" id="r-detalle"></ul>
        <div class="resumen-total"><span>Total a pagar</span><strong id="r-total">$0</strong></div>
    </section>

    <!-- Formulario de pago simulado -->
    <section class="pago-tarjeta" id="bloque-pago">
        <h2>Datos de pago</h2>
        <form id="form-pago" autocomplete="off">
            <label for="titular">Nombre en la tarjeta</label>
            <input type="text" id="titular" required>

            <label for="numero">Número de tarjeta</label>
            <input type="text" id="numero" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" required>

            <div class="fila-doble">
                <div>
                    <label for="vence">Vencimiento</label>
                    <input type="text" id="vence" inputmode="numeric" maxlength="5" placeholder="MM/AA" required>
                </div>
                <div>
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" inputmode="numeric" maxlength="4" placeholder="•••" required>
                </div>
            </div>

            <button type="submit" class="btn-pagar">Pagar ahora</button>
            <p class="aviso-simulado">Pago simulado: no se cobra ni se guarda ningún dato de tarjeta.</p>
        </form>
    </section>

    <!-- Confirmación -->
    <section class="pago-tarjeta exito" id="exito">
        <h2>¡Pago recibido! 🎉</h2>
        <p>Gracias, <strong id="e-nombre"></strong>. Tu pedido ya está en el comal.</p>
        <p class="folio" id="e-folio"></p>
        <a class="btn-volver" href="proyecto.html">Volver al inicio</a>
    </section>

</main>

<script>
    // Leer los datos que manda php/orden.php en la URL
    var params = new URLSearchParams(window.location.search);
    var folio = params.get('folio');
    var total = params.get('total');

    // Si se entra directo a pago.html sin pedido, regresar al formulario
    if (!folio || !total) {
        window.location.replace('proyecto.html#pedido');
    }

    document.getElementById('r-folio').textContent = folio || '';
    document.getElementById('r-nombre').textContent = params.get('nombre') || '';
    document.getElementById('r-tipo').textContent = params.get('tipo') || '';
    document.getElementById('r-total').textContent = '$' + (total || 0);

    var lista = document.getElementById('r-detalle');
    (params.get('detalle') || '').split('|').forEach(function (linea) {
        if (!linea) return;
        var li = document.createElement('li');
        li.textContent = linea;   // textContent evita inyección de HTML
        lista.appendChild(li);
    });

    // Formato de tarjeta y fecha
    document.getElementById('numero').addEventListener('input', function () {
        var v = this.value.replace(/\D/g, '').slice(0, 16);
        this.value = v.replace(/(.{4})/g, '$1 ').trim();
    });
    document.getElementById('vence').addEventListener('input', function () {
        var v = this.value.replace(/\D/g, '').slice(0, 4);
        this.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
    });
    document.getElementById('cvv').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '');
    });

    // Pago simulado: al aprobarse, avisa al servidor para marcar el pedido
    // como pagado, descontar el stock y sumar a "vendidos".
    document.getElementById('form-pago').addEventListener('submit', function (e) {
        e.preventDefault();
        var digitos = document.getElementById('numero').value.replace(/\D/g, '');
        if (digitos.length !== 16) {
            alert('El número de tarjeta debe tener 16 dígitos.');
            return;
        }

        var formPago = this;
        var datos = new FormData();
        datos.append('folio', folio);
        datos.append('paypal_id', 'SIMULADO');

        fetch('php/confirmar_pago.php', { method: 'POST', body: datos })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.ok) {
                    alert(res.error || 'No se pudo confirmar el pago.');
                    return;
                }
                document.getElementById('e-nombre').textContent = params.get('nombre') || '';
                document.getElementById('e-folio').textContent = 'Folio: ' + folio;
                document.getElementById('resumen').style.display = 'none';
                document.getElementById('bloque-pago').style.display = 'none';
                document.getElementById('exito').style.display = 'block';
                formPago.reset();
            })
            .catch(function () {
                alert('No se pudo conectar con el servidor.');
            });
    });
</script>
</body>
</html>
